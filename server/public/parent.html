<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#15803d">
<meta name="description" content="Wellspire Parent Portal">
<title>Wellspire Parent Portal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Ctext%20y%3D%27.9em%27%20font-size%3D%2790%27%3E%F0%9F%8E%92%3C/text%3E%3C/svg%3E">
</head>
<body>
<style>
  :root{
    --paper:#f6f7f3; --surface:#ffffff; --surface-2:#eef0ea; --ink:#17231d; --muted:#65726a; --line:#e6e7df;
    --green:#15803d; --green-deep:#0f5c2c; --green-weak:#e7f3ec;
    --gold:#b07d13; --gold-weak:#f7edd3;
    --sky:#0284c7; --sky-weak:#e2f2fb; --amber:#c2790c; --amber-weak:#fbf0da; --rose:#e11d48; --rose-weak:#fde8ee;
    --violet:#7c3aed; --violet-weak:#efe9fe; --emerald:#059669; --emerald-weak:#e3f6ee;
    --hero1:#146c3a; --hero2:#0d5730; --hero-fg:#eef6f0; --hero-muted:#bcd6c6; --hero-gold:#f0d38a; --hero-line:rgba(255,255,255,.14);
    --shadow:0 1px 2px rgba(20,35,29,.05),0 10px 30px -14px rgba(20,35,29,.18);
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --serif:"Iowan Old Style",Palatino,Georgia,serif;
    --r:20px;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --paper:#0c110e; --surface:#141a16; --surface-2:#1a221c; --ink:#e9f0ea; --muted:#9db0a4; --line:#26302a;
    --green:#4ec27d; --green-deep:#3aa869; --green-weak:#15271d;
    --gold:#dcb765; --gold-weak:#2a2313;
    --sky:#38bdf8; --sky-weak:#0d2735; --amber:#fbbf24; --amber-weak:#2a2110; --rose:#fb7185; --rose-weak:#2a1420;
    --violet:#a78bfa; --violet-weak:#211a3a; --emerald:#34d399; --emerald-weak:#0f2a20;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 36px -16px rgba(0,0,0,.6);
  }}
  :root[data-theme="dark"]{
    --paper:#0c110e; --surface:#141a16; --surface-2:#1a221c; --ink:#e9f0ea; --muted:#9db0a4; --line:#26302a;
    --green:#4ec27d; --green-deep:#3aa869; --green-weak:#15271d; --gold:#dcb765; --gold-weak:#2a2313;
    --sky:#38bdf8; --sky-weak:#0d2735; --amber:#fbbf24; --amber-weak:#2a2110; --rose:#fb7185; --rose-weak:#2a1420;
    --violet:#a78bfa; --violet-weak:#211a3a; --emerald:#34d399; --emerald-weak:#0f2a20;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 36px -16px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1040px;margin:0 auto;padding:0 18px;}
  .num{font-variant-numeric:tabular-nums;}
  a{color:inherit;text-decoration:none;}
  ::selection{background:var(--green);color:#fff;}
  h1,h2,h3{margin:0;}
  @media (prefers-reduced-motion:no-preference){.rise{opacity:0;transform:translateY(10px);animation:r .6s cubic-bezier(.2,.7,.2,1) forwards;}@keyframes r{to{opacity:1;transform:none;}}}

  /* top bar */
  .top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--paper) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .top-in{display:flex;align-items:center;gap:12px;height:60px;}
  .crest{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font-family:var(--serif);font-weight:700;background:linear-gradient(150deg,var(--green),var(--green-deep));position:relative;}
  .crest::after{content:"";position:absolute;inset:3px;border-radius:7px;border:1px solid rgba(240,211,138,.5);}
  .top b{font-size:15px;} .top .sub{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
  .top-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
  .icon-btn{width:38px;height:38px;display:grid;place-items:center;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;position:relative;}
  .icon-btn:hover{color:var(--green);border-color:var(--green);}
  .avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;background:linear-gradient(135deg,#b07d13,#8a6212);}
  .dot-badge{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--rose);}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

  /* child switcher */
  .switcher{display:flex;gap:8px;padding:14px 0 2px;overflow-x:auto;}
  .chip-child{display:flex;align-items:center;gap:9px;padding:7px 13px 7px 7px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;white-space:nowrap;transition:.15s;}
  .chip-child .a{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;}
  .chip-child b{font-size:13.5px;} .chip-child span{font-size:11px;color:var(--muted);display:block;line-height:1;}
  .chip-child.active{border-color:var(--green);background:var(--green-weak);}

  /* hero child card */
  .hero{position:relative;overflow:hidden;border-radius:var(--r);padding:24px;color:var(--hero-fg);margin-top:12px;
    background:radial-gradient(120% 140% at 90% 0%,var(--hero1),var(--hero2) 65%);box-shadow:var(--shadow);}
  .hero::before{content:"";position:absolute;inset:0;opacity:.5;background-image:radial-gradient(circle at 1px 1px,rgba(240,211,138,.18) 1px,transparent 0);background-size:24px 24px;mask-image:radial-gradient(80% 90% at 85% 0,#000,transparent 72%);}
  .hero-row{position:relative;display:flex;gap:20px;align-items:center;flex-wrap:wrap;}
  .ring{position:relative;width:104px;height:104px;flex:none;}
  .ring .pct{position:absolute;inset:0;display:grid;place-items:center;text-align:center;}
  .ring .pct b{font-size:24px;color:#fff;line-height:1;} .ring .pct span{font-size:10px;color:var(--hero-muted);}
  .hero-info{min-width:180px;flex:1;}
  .hero-info .hi{font-size:12.5px;color:var(--hero-muted);}
  .hero-info h1{font-family:var(--serif);font-size:26px;color:#fff;margin:2px 0 4px;}
  .hero-info .meta{font-size:13px;color:var(--hero-muted);}
  .house{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;font-weight:600;color:#fff;background:rgba(255,255,255,.12);border:1px solid var(--hero-line);padding:4px 10px;border-radius:999px;}
  .quick{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px;}
  .q{background:rgba(255,255,255,.07);border:1px solid var(--hero-line);border-radius:14px;padding:12px;}
  .q .k{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--hero-muted);}
  .q .v{font-size:16px;font-weight:800;color:#fff;margin-top:3px;} .q .v small{font-weight:600;font-size:11px;color:var(--hero-gold);}

  /* section grid */
  .grid{display:grid;gap:16px;grid-template-columns:1fr;margin-top:16px;}
  @media (min-width:720px){.grid{grid-template-columns:1fr 1fr;}}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);}
  .card.wide{grid-column:1/-1;}
  .card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .card-h .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:17px;}
  .card-h h3{font-size:16px;} .card-h .more{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--green);cursor:pointer;}
  .tint-sky{background:var(--sky-weak);color:var(--sky);} .tint-amber{background:var(--amber-weak);color:var(--amber);}
  .tint-rose{background:var(--rose-weak);color:var(--rose);} .tint-violet{background:var(--violet-weak);color:var(--violet);}
  .tint-emerald{background:var(--emerald-weak);color:var(--emerald);} .tint-green{background:var(--green-weak);color:var(--green);} .tint-gold{background:var(--gold-weak);color:var(--gold);}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 16px;border-radius:12px;font-weight:700;font-size:13.5px;cursor:pointer;border:1px solid transparent;font-family:var(--sans);transition:.15s;}
  .btn-green{background:var(--green);color:#fff;} .btn-green:hover{background:var(--green-deep);}
  .btn-soft{background:var(--surface-2);color:var(--ink);border-color:var(--line);} .btn-soft:hover{border-color:var(--green);}

  /* fees */
  .fee-amt{font-family:var(--serif);font-size:30px;} .fee-due{font-size:12.5px;color:var(--muted);}
  .bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin:14px 0 6px;}
  .bar>i{display:block;height:100%;background:var(--amber);border-radius:99px;}
  .fee-line{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:4px 0;}

  /* timetable */
  .tt-item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;}
  .tt-item+.tt-item{margin-top:6px;} .tt-item.now{background:var(--green-weak);}
  .tt-ic{width:36px;height:36px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:17px;flex:none;}
  .tt-item b{font-size:13.5px;display:block;} .tt-item span{font-size:11.5px;color:var(--muted);}
  .tt-time{margin-left:auto;font-size:12px;font-weight:700;color:var(--muted);}
  .nowtag{font-size:9.5px;font-weight:800;letter-spacing:.05em;color:#fff;background:var(--green);padding:2px 7px;border-radius:99px;margin-left:auto;}

  /* results */
  .res{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);}
  .res:last-child{border-bottom:none;} .res b{font-size:13.5px;flex:1;}
  .gpill{font-weight:800;font-size:12px;padding:3px 10px;border-radius:99px;}
  .res .sc{width:64px;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;}
  .res .sc>i{display:block;height:100%;background:var(--green);}

  /* attendance strip */
  .attn{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;}
  .attn .d{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;}
  .aP{background:var(--emerald);} .aA{background:var(--rose);} .aL{background:var(--amber);} .aH{background:var(--surface-2);color:var(--muted);}

  /* list rows */
  .row{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);}
  .row:last-child{border-bottom:none;}
  .row .lead{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;}
  .row b{font-size:13.5px;display:block;} .row span{font-size:12px;color:var(--muted);}
  .row .when{margin-left:auto;font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap;}
  .hw-check{width:20px;height:20px;border-radius:7px;border:2px solid var(--line);cursor:pointer;flex:none;margin-top:2px;display:grid;place-items:center;color:#fff;font-size:11px;}
  .hw-check.done{background:var(--green);border-color:var(--green);}
  .hw-done b{text-decoration:line-through;color:var(--muted);}

  .notice-badge{display:inline-block;font-size:10px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--gold-weak);color:var(--gold);}

  /* toast */
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
    background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:0 10px 30px -8px rgba(0,0,0,.5);transition:.3s;z-index:80;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  footer{text-align:center;color:var(--muted);font-size:12.5px;padding:34px 0 40px;}
  footer a{color:var(--green);font-weight:600;}
</style>

<div class="top">
  <div class="wrap top-in">
    <span class="crest">W</span>
    <div><b>Parent Portal</b><div class="sub">Wellspire International</div></div>
    <div class="top-right">
      <button class="icon-btn" title="Notices"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="dot-badge"></span></button>
      <button class="icon-btn" id="themeBtn" title="Theme"><svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <div class="avatar" title="Rohan Gupta">RG</div>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="switcher" id="switcher"></div>
  <div class="hero rise" id="hero"></div>
  <div class="grid" id="grid"></div>

  <footer>
    Signed in as <b>Rohan Gupta</b> · <a href="/" target="_blank" rel="noreferrer">Open full school system →</a><br>
    <span style="opacity:.7">Wellspire International School · Pune · Demo portal with sample data</span>
  </footer>
</div>

<div class="toast" id="toast"></div>

<script>
const NOTICES=[
  {t:"PTM this Saturday, 10 AM",s:"Parent–teacher meeting for Grades 1–5. Please confirm your slot.",when:"2d",badge:"Event"},
  {t:"Annual Day rehearsals begin",s:"Costumes to be sent by 20 Aug. Details on the class group.",when:"4d",badge:"Notice"},
  {t:"Fee reminder — Term 2",s:"Kindly clear pending dues by 20 Aug to avoid late charges.",when:"5d",badge:"Fees"}
];
const EVENTS=[
  {t:"Independence Day",d:"15",m:"AUG",c:"var(--green)"},
  {t:"Science Fair",d:"12",m:"SEP",c:"var(--sky)"},
  {t:"Sports Day",d:"04",m:"OCT",c:"var(--amber)"}
];

const CHILDREN={
  aarav:{ name:"Aarav Gupta", grade:"Grade 5 · Section A", roll:"01", teacher:"Ms. Priya Sharma",
    house:"Emerald House", houseColor:"#10b981", av:"AG", avc:"#0ea5e9", attendance:96,
    attn:["P","P","P","A","P","P","P","P","L","P","P","P"],
    fees:{due:15000,total:31000,paid:16000,dueDate:"20 Aug 2026",items:[["Term 2 Tuition",25000],["Transport",6000]]},
    next:{subj:"Mathematics",time:"08:00"},
    tt:[["08:00","Mathematics","Priya Sharma","➗",1],["08:50","English","Rahul Menon","📖",0],["09:40","Science","Anjali Verma","🔬",0],["10:50","Computer Sci.","Sneha Rao","💻",0],["11:40","Phys. Ed.","Coach Das","⚽",0]],
    results:{overall:91,grade:"A",subs:[["Mathematics","A",94],["English","A-",89],["Science","A",92],["Social Studies","B+",86],["Computer","A+",97]]},
    hw:[["Mathematics","Fractions worksheet 4","Tomorrow","var(--sky)"],["English","Write a 200-word story","Fri","var(--violet)"],["Science","Leaf collection project","Mon","var(--emerald)"]],
    lib:[["The Jungle Book","R. Kipling","Due 18 Aug","due"]]
  },
  sara:{ name:"Sara Gupta", grade:"Grade 2 · Section B", roll:"05", teacher:"Ms. Fatima Sheikh",
    house:"Amber House", houseColor:"#f59e0b", av:"SG", avc:"#8b5cf6", attendance:98,
    attn:["P","P","P","P","P","H","P","P","P","P","P","P"],
    fees:{due:0,total:26000,paid:26000,dueDate:"—",items:[["Term 2 Tuition",20000],["Transport",6000]]},
    next:{subj:"Story Time",time:"08:00"},
    tt:[["08:00","Story Time","Fatima Sheikh","📚",1],["08:50","Numbers","Fatima Sheikh","🔢",0],["09:40","Art & Craft","Neha Rao","🎨",0],["10:50","Music","Sam D'Souza","🎵",0],["11:40","Play","Coach Das","🪁",0]],
    results:{overall:95,grade:"A+",subs:[["Language","★★★★★",96],["Numeracy","★★★★★",95],["Art","★★★★★",98],["Music","★★★★☆",90]]},
    hw:[["Reading","Read pages 12–15 aloud","Tomorrow","var(--emerald)"],["Numbers","Count to 100 practice","Wed","var(--sky)"]],
    lib:[]
  }
};

const inr=n=>"₹"+Number(n).toLocaleString("en-IN");
const gcolor=g=>{const m={"A+":"emerald","A":"green","A-":"green","B+":"sky","B":"amber"};return m[g]||"green";};
const gbg={emerald:["var(--emerald-weak)","var(--emerald)"],green:["var(--green-weak)","var(--green)"],sky:["var(--sky-weak)","var(--sky)"],amber:["var(--amber-weak)","var(--amber)"]};

let active="aarav";

function renderSwitcher(){
  document.getElementById("switcher").innerHTML=Object.entries(CHILDREN).map(([id,c])=>`
    <button class="chip-child ${id===active?"active":""}" onclick="setChild('${id}')">
      <span class="a" style="background:${c.avc}">${c.av}</span>
      <span><b>${c.name.split(" ")[0]}</b><span>${c.grade.split("·")[0].trim()}</span></span>
    </button>`).join("");
}

function renderHero(c){
  const C=263.9, off=C*(1-c.attendance/100);
  document.getElementById("hero").innerHTML=`
    <div class="hero-row">
      <div class="ring">
        <svg width="104" height="104" viewBox="0 0 104 104">
          <circle cx="52" cy="52" r="42" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="9"/>
          <circle cx="52" cy="52" r="42" fill="none" stroke="var(--hero-gold)" stroke-width="9" stroke-linecap="round"
            stroke-dasharray="${C}" stroke-dashoffset="${off}" transform="rotate(-90 52 52)"/>
        </svg>
        <div class="pct"><div><b>${c.attendance}%</b><span>attendance</span></div></div>
      </div>
      <div class="hero-info">
        <div class="hi">Welcome back, Rohan 👋</div>
        <h1>${c.name}</h1>
        <div class="meta">${c.grade} · Roll ${c.roll} · Class teacher ${c.teacher}</div>
        <span class="house" style="--h:${c.houseColor}"><span style="width:8px;height:8px;border-radius:50%;background:${c.houseColor};display:inline-block"></span> ${c.house}</span>
      </div>
    </div>
    <div class="quick">
      <div class="q"><div class="k">Fees due</div><div class="v">${c.fees.due>0?inr(c.fees.due):"Cleared ✓"}</div></div>
      <div class="q"><div class="k">Next class</div><div class="v">${c.next.subj.split(" ")[0]} <small>${c.next.time}</small></div></div>
      <div class="q"><div class="k">Notices</div><div class="v">${NOTICES.length} <small>new</small></div></div>
    </div>`;
}

function renderGrid(c){
  const feePct=Math.round(c.fees.paid/c.fees.total*100);
  const attn=c.attn.map(s=>`<div class="d a${s}" title="${{P:'Present',A:'Absent',L:'Late',H:'Holiday'}[s]}">${s}</div>`).join("");
  const tt=c.tt.map(([t,s,tea,ic,now])=>`
    <div class="tt-item ${now?'now':''}"><div class="tt-ic">${ic}</div>
      <div><b>${s}</b><span>${tea}</span></div>
      ${now?'<span class="nowtag">NOW</span>':`<span class="tt-time num">${t}</span>`}</div>`).join("");
  const res=c.results.subs.map(([s,g,pc])=>{const col=gcolor(g);return `
    <div class="res"><b>${s}</b>
      <span class="gpill" style="background:${gbg[col][0]};color:${gbg[col][1]}">${g}</span>
      <span class="sc"><i style="width:${pc}%;background:${gbg[col][1]}"></i></span></div>`;}).join("");
  const hw=c.hw.map((h,i)=>`
    <div class="row" data-hw="${i}"><div class="hw-check" onclick="toggleHw(this)"></div>
      <div><b>${h[1]}</b><span>${h[0]}</span></div><span class="when" style="color:${h[3]}">${h[2]}</span></div>`).join("");
  const lib=c.lib.length?c.lib.map(([t,a,due])=>`
    <div class="row"><span class="lead" style="background:var(--amber)"></span>
      <div><b>${t}</b><span>${a}</span></div><span class="when" style="color:var(--amber)">${due}</span></div>`).join("")
    :`<p style="font-size:13px;color:var(--muted)">No books issued right now.</p>`;
  const notices=NOTICES.map(n=>`
    <div class="row"><span class="lead" style="background:var(--green)"></span>
      <div><b>${n.t}</b><span>${n.s}</span></div><span class="when">${n.when}</span></div>`).join("");
  const events=EVENTS.map(e=>`
    <div class="row"><div style="width:44px;text-align:center;flex:none">
      <div style="font-family:var(--serif);font-size:20px;color:${e.c};line-height:1">${e.d}</div>
      <div style="font-size:10px;font-weight:800;color:var(--muted)">${e.m}</div></div>
      <div><b>${e.t}</b><span>Whole school</span></div></div>`).join("");

  document.getElementById("grid").innerHTML=`
    <div class="card rise">
      <div class="card-h"><div class="ic tint-amber">💳</div><h3>Fees</h3><span class="more" onclick="toast('Opening secure payment… (demo)')">Pay now</span></div>
      ${c.fees.due>0?`<div class="fee-amt num">${inr(c.fees.due)}</div><div class="fee-due">due by ${c.fees.dueDate}</div>`
        :`<div class="fee-amt" style="color:var(--emerald)">All cleared ✓</div><div class="fee-due">No pending dues — thank you!</div>`}
      <div class="bar"><i style="width:${feePct}%"></i></div>
      <div class="fee-line"><span>Paid ${inr(c.fees.paid)} of ${inr(c.fees.total)}</span><span>${feePct}%</span></div>
      ${c.fees.items.map(it=>`<div class="fee-line"><span>${it[0]}</span><span class="num">${inr(it[1])}</span></div>`).join("")}
      ${c.fees.due>0?`<button class="btn btn-green" style="width:100%;margin-top:12px" onclick="toast('Opening secure payment… (demo)')">Pay ${inr(c.fees.due)}</button>`:''}
    </div>

    <div class="card rise">
      <div class="card-h"><div class="ic tint-sky">📅</div><h3>Today's classes</h3><span class="more" onclick="toast('Full weekly timetable (demo)')">Week</span></div>
      ${tt}
    </div>

    <div class="card rise">
      <div class="card-h"><div class="ic tint-violet">🏆</div><h3>Results</h3>
        <span class="gpill" style="margin-left:auto;background:var(--green-weak);color:var(--green)">${c.results.grade} · ${c.results.overall}%</span></div>
      ${res}
    </div>

    <div class="card rise">
      <div class="card-h"><div class="ic tint-emerald">✅</div><h3>Attendance</h3>
        <span class="more" style="cursor:default">last 12 days</span></div>
      <div class="attn">${attn}</div>
      <div class="fee-line" style="margin-top:12px"><span>Present this term</span><span style="color:var(--emerald);font-weight:700">${c.attendance}%</span></div>
    </div>

    <div class="card rise">
      <div class="card-h"><div class="ic tint-gold">📝</div><h3>Homework</h3><span class="more" style="cursor:default">${c.hw.length} due</span></div>
      ${hw}
    </div>

    <div class="card rise">
      <div class="card-h"><div class="ic tint-green">📚</div><h3>Library</h3></div>
      ${lib}
    </div>

    <div class="card wide rise">
      <div class="card-h"><div class="ic tint-green">📢</div><h3>School notices</h3><span class="more" onclick="toast('All notices (demo)')">See all</span></div>
      ${notices}
    </div>

    <div class="card wide rise">
      <div class="card-h"><div class="ic tint-sky">🎉</div><h3>Upcoming events</h3></div>
      ${events}
      <button class="btn btn-soft" style="width:100%;margin-top:14px" onclick="toast('Messaging '+CHILDREN[active].teacher+' (demo)')">✉️ Message class teacher</button>
    </div>`;
}

function render(){const c=CHILDREN[active];renderSwitcher();renderHero(c);renderGrid(c);}
function setChild(id){active=id;render();window.scrollTo({top:0,behavior:'smooth'});}
function toggleHw(el){el.classList.toggle('done');el.innerHTML=el.classList.contains('done')?'✓':'';el.closest('.row').classList.toggle('hw-done');}
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200);}

(function(){var root=document.documentElement,b=document.getElementById('themeBtn'),ic=document.getElementById('themeIcon');
  var moon='<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',sun='<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
  function cur(){var t=root.getAttribute('data-theme');return t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');}
  function paint(){ic.innerHTML=cur()==='dark'?sun:moon;}
  b.addEventListener('click',function(){root.setAttribute('data-theme',cur()==='dark'?'light':'dark');paint();});paint();})();

render();
</script>
